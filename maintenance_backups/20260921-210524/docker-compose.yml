services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: smartcar:kinetic
    container_name: smartcar-sim
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/machine-id:/etc/machine-id:ro
    command: ["sim", "gui:=false", "rviz:=false"]

  sim-gui:
    image: smartcar:kinetic-run
    container_name: smartcar-sim-gui
    network_mode: host
    stdin_open: true
    tty: true
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
      LIBGL_ALWAYS_SOFTWARE: "0"
      OGRE_RTT_MODE: Copy
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/machine-id:/etc/machine-id:ro
    command: ["sim-gui"]
    profiles: ["gui"]
