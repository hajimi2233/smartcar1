# 当前车辆没有轮速编码器。定位链为：/scan + /imu/data -> laser_scan_matcher -> odom TF -> AMCL。
# /sim/ground_truth/odom 只允许离线评估，不能转发为 /odom。
sensors:
  ideal: false

# 定位可调参数（改完需重启 localization）
# 路径: smartcar_navigation/config/localization.yaml

# ---------- 雷达扫描匹配 + IMU（局部连续坐标系）----------
laser_imu_frontend:
  scan_topic: /scan
  imu_topic: /imu/data
  fixed_frame: odom
  base_frame: base_footprint
  use_odom: false
  use_imu: true
  publish_tf: true

# ---------- 雷达 vs 局部扫描匹配（AMCL）----------
amcl:
  odom_frame_id: odom
  base_frame_id: base_footprint
  global_frame_id: map
  tf_broadcast: true
  odom_model_type: diff
  use_map_topic: true
  first_map_only: true
  update_min_d: 0.0          # 0=停下也用雷达更新
  update_min_a: 0.0
  resample_interval: 1
  transform_tolerance: 0.3
  gui_publish_rate: 10.0
  kld_err: 0.02
  # AMCL 的运动先验来自激光扫描匹配，不是轮速；这里仍保留模型噪声参数，
  # 用于描述局部前端的短时不确定性。
  odom_alpha1: 0.85
  odom_alpha2: 0.80
  odom_alpha3: 0.80
  odom_alpha4: 0.85
  # 激光模型：z_hit 越大越信「打在墙上」；sigma_hit 越小匹配越锐
  laser_model_type: likelihood_field
  laser_z_hit: 0.97
  laser_z_short: 0.01
  laser_z_max: 0.01
  laser_z_rand: 0.01
  laser_sigma_hit: 0.05      # 米
  laser_likelihood_max_dist: 2.0
  laser_max_range: 12.0
  laser_max_beams: 360
  min_particles: 300
  max_particles: 1500
  # 粒子重撒：0=不跳；fast>0 雷达对不上时会跳
  recovery_alpha_slow: 0.001
  recovery_alpha_fast: 0.1
  initial_cov_xx: 0.25
  initial_cov_yy: 0.25
  initial_cov_aa: 0.5

# ---------- 激光噪声（仿真传感器）----------
laser_noise:
  stddev: 0.02               # 米

# ---------- 自制 scan_match（当前 launch 未启动，仅留档）----------
scan_match_localizer:
  sigma: 0.08                # 射线距离差的高斯 sigma，米
  min_score: 0.30            # 低于此分保持上一帧，不跳图
  xy_win: 0.18               # 每帧搜索半宽，米
  xy_step: 0.06
  yaw_win: 0.12              # 约 7 度
  yaw_step: 0.04
  stride: 8                  # 每 N 条射线用 1 条
  max_xy: 0.15               # 单帧最大修正，米（防跳列）
  max_yaw: 0.14              # 单帧最大修正，弧度
  freeze_xy: 0.02            # 小于此视为静止，去掉抖动
  freeze_yaw: 0.015
